version: 1
interfaces:
  - name: frigate_web
    protocol: http
    servers:
      - name: frigate_web_client
        spec:
          string: frigate:15.1  # copy of OpenAPI spec in schema/swagger.json
        port: 8971
        is_system_interface: true
  - name: mediamtx_http
    protocol: http
    clients:
      - name: mediamtx_api
        spec:
          string: mediamtx_api:1.0  # copy of OpenAPI spec in schema/swagger.json
peripheral_requirements:
  - name: RENDER
    peripheral_type: GenericDevice
    constraints:
      type: GenericDevice
      path_prefix: "/dev/dri/renderD"
container_config:
  volumes:
    - frigate_storage:/media/frigate:rw
    - frigate_config:/config:rw
    - /etc/localtime:/etc/localtime:ro
build:
  build_kit:
    name: file://docker/main/Dockerfile
    platforms: ["linux/amd64"]

