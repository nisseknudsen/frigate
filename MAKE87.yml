version: 1
interfaces:
  - name: frigate
    protocol: http
    servers:
      - name: frigate_web
        spec:
          string: frigate:15.1
        port:
          name: frigate_web
          protocol: HTTP
          target_port: 8971
          is_system_interface: true
      - name: frigate_api
        spec:
          string: frigate_api:15.1
        port:
          name: frigate_web
          protocol: HTTP
          target_port: 5000
  - name: mediamtx_http
    protocol: http
    clients:
      - name: mediamtx_api
        spec:
          string: mediamtx_api:1.0  # copy of OpenAPI spec in schema/mediamtx/swagger.json
peripheral_requirements:
  - name: RENDER
    peripheral_type: GenericDevice
    constraints:
      type: GenericDevice
      path_prefix: "/dev/dri/renderD"
container_config:
  volumes:
    - frigate_storage:/media/frigate:rw
    - frigate_config:/config:rw
    - /etc/localtime:/etc/localtime:ro
build:
  build_kit:
    name: file://docker/main/Dockerfile
    platforms: ["linux/amd64"]

