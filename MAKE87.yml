version: 1
interfaces:
  - name: frigate
    protocol: http
    servers:
      - name: frigate_web
        spec:
          string: frigate:15.1
        port:
          name: frigate_web
          protocol: HTTP
          target_port: 8971
          is_system_interface: true
      - name: frigate_api
        spec:
          string: frigate_api:15.1
        port:
          name: frigate_api
          protocol: HTTP
          target_port: 5000
      - name: mediamtx_api  # used to list all available cameras in mediamtx format
        spec:
          string: mediamtx_api:1.0  # copy of OpenAPI spec in schema/swagger.json
        port:
          name: mediamtx_api
          protocol: HTTP
          target_port: 9997
      - name: restream_rtsp
        spec:
          string: rtsp  # no specific spec, just a placeholder for RTSP connections
        port:
          name: restream_rtsp
          protocol: TCP
          target_port: 8554
config:
  type: object
  properties:
    cameras:
      type: array
      items:
        type: object
        properties:
          camera_name:
            type: string
            description: Optional label or ID for the camera (defaults to camera_ip if not set)
          camera_ip:
            type: string
            description: IP address or hostname of the camera
          camera_port:
            type: integer
            description: RTSP port of the camera
            default: 554
          camera_path:
            type: string
            description: RTSP URI path or suffix for the camera
            default: "/"
          camera_username:
            type: string
            description: Username for the camera (optional)
            default: null
          camera_password:
            type: string
            description: Password for the camera (optional, only if username is set)
            default: null
          onvif_port:
            type: [integer, "null"]
            description: Set to the ONVIF port of the camera if available, otherwise leave empty
            default: null
        required:
          - camera_ip
  required:
    - cameras
peripheral_requirements:
  - name: RENDER
    peripheral_type: GenericDevice
    constraints:
      type: GenericDevice
      path_prefix: "/dev/dri/renderD"
container_config:
  volumes:
    - frigate_storage:/media/frigate:rw
    - frigate_config:/config:rw
    - /etc/localtime:/etc/localtime:ro
build:
  custom:
    dockerfile: docker/main/Dockerfile
    platforms: ["linux/amd64"]
dev_build:
  build_kit:
    name: python3
    platforms: ["linux/amd64"]

