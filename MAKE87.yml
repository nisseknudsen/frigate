build_kit:
  name: file://docker/main/Dockerfile
  version: latest
  target_architectures: [amd64]
provider_endpoints:
  - name: RTSP_STREAM
    requester_message_type: make87_messages.transport.rtsp.RTSPRequest
    provider_message_type: make87_messages.primitive.bool.Bool
port_requirements:
  - name: log-ws
    protocol: TCP
    target_port: 8971
volume_requirements:
  - mount_path: /media/frigate
    source: frigate_storage
  - mount_path: /config
    source: frigate_config
  - mount_path: /etc/localtime
    source: /etc/localtime